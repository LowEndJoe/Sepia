<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEPIA Boutique Streaming Platform</title>
    <!-- Load Font Awesome (for the footer icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        // Use a clean, modern sans-serif font
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        // Option 2: Charcoal/Sepia Shift (The approved palette)
                        'sepia-dark': '#1A191A', // Rich Charcoal Black (Background/Text)
                        'sepia-light': '#EBEBEB', // Aged Paper White (Text)
                        'sepia-primary': '#B89366', // Subdued Bronze/Ochre (Accent)
                    }
                }
            }
        }
    </script>
    <style>
        /* Ensures the HTML tag uses the dark background for a seamless look */
        html {
            background-color: #1A191A;
        }

        /* Custom Scrollbar Styling for Dark Theme */
        body::-webkit-scrollbar {
            width: 8px;
        }
        body::-webkit-scrollbar-track {
            background: #1A191A;
        }
        body::-webkit-scrollbar-thumb {
            background: #B89366; /* Bronze accent */
            border-radius: 4px;
        }

        /* Custom styling for video controls */
        video::-webkit-media-controls-panel {
            background-color: #1A191A;
            color: #EBEBEB;
        }
        
        /* === FIX: Style for links inside the synopsis text === */
        #content-area p a {
            color: #B89366; /* Use sepia-primary color */
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        #content-area p a:hover {
            text-decoration: underline;
            color: #D9AC6F; /* Slightly brighter on hover */
        }
        /* =================================================== */

        /* Custom Class for the Diagonal Overlay (Option 3 Geometry) */
        .diagonal-overlay {
            /* Mask creates the diagonal cut */
            mask-image: linear-gradient(to bottom, transparent 0%, transparent 50%, black 50%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 50%, black 50%, black 100%);
            
            /* Apply a slight upward diagonal skew */
            transform: skewY(-2deg);
            transform-origin: bottom right;
            
            /* Reverse the skew on the content inside to keep it straight */
            & > * {
                transform: skewY(2deg);
                transform-origin: bottom right;
            }
        }

    </style>
</head>
<body class="bg-sepia-dark text-sepia-light min-h-screen font-sans">

    <div id="app-container" class="max-w-7xl mx-auto p-4 md:p-8">

        <!-- Header -->
        <header class="text-center py-8">
            <h1 class="text-5xl md:text-7xl font-extrabold text-sepia-primary tracking-widest uppercase">SEPIA</h1>
            <p class="text-sm text-sepia-light/70 mt-2 italic">A Curated Boutique Platform, I own nothing, sporadically updated.</p>
        </header>

        <!-- Dynamic Content Area -->
        <main id="content-area" class="mt-8">
            <!-- Content will be rendered here by JavaScript -->
        </main>
        
    </div>

    <!-- Footer: Your Custom Branding (Icons Removed) -->
    <footer class="mt-20 py-6 text-center text-xs border-t border-sepia-primary/20">
        <div class="flex flex-col md:flex-row justify-center items-center space-y-2 md:space-y-0 md:space-x-6">
            <!-- Main Credit & Link (Icons Removed) -->
            <p class="text-sm text-sepia-light/80">
                MADE BY <a href="http://www.harad.tech" class="text-sepia-primary hover:text-sepia-light/90 transition duration-200 font-semibold" target="_blank" rel="noopener noreferrer">HARAD, 2025</a>
            </p>

            <!-- Separator and Icon container removed -->
        </div>
    </footer>


    <script>
        // --- Core Application Data and State ---

        // State object manages the current view
        const APP_STATE = {
            view: 'home', // 'home' or 'detail'
            selectedFilmId: null,
            isPlaying: false, // Tracks if video player is active (Detail View only)
        };

        // Utility function to determine if a URL is a YouTube link and extract the embed URL
        function getYouTubeEmbedUrl(url) {
            if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('v=')[1].split('&')[0];
                return `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1`;
            } else if (url.includes('youtu.be/')) {
                const videoId = url.split('youtu.be/')[1].split('?')[0];
                return `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1`;
            }
            return null;
        }


        // Mock Film Data (6 entries as required)
        const MOCK_FILMS = [
            // Changed videoUrl 1 to a YouTube sample for testing
            { id: 1, title: "The Red Chapel", year: 2009, director: "M. Hansen", genre: "Documentary", country: "Denmark", 
              coverUrl: "https://i.imgur.com/7NZXJNU.png", 
              videoUrl: "https://www.youtube.com/watch?v=TpqeHIj3tgk", // YouTube Link
              synopsis: "Three Danish comedians grapple with identity and play 'Wonderwall' for a captive audience." },
            
            { id: 2, title: "A", year: 1998, director: "Tatsuya Mori", genre: "Documentary", country: "Japan", 
              coverUrl: "https://i.imgur.com/ETzZ9vP.png",
              videoUrl: "https://www.youtube.com/watch?v=-feFmwGx6h4", // Standard Video
              // FIX: Changed inner double quotes to single quotes to prevent SyntaxError
              synopsis: "An inside look of the infamous cult Aum Shinrikyo only a few years after the <a href='https://en.wikipedia.org/wiki/Tokyo_subway_sarin_attack'>infamous sarin attack.</a>" },
            
            { id: 3, title: "Hook, Line, and Sinker", year: 1930, director: "Edward F. Cline", genre: "Comedy", country: "USA", 
              coverUrl: "https://i.imgur.com/FHwV5E0.png", 
              videoUrl: "https://www.youtube.com/watch?v=BYuZ0q964yE", // YouTube Shortlink
              synopsis: "Two insurance salesmen wind up restoring a broke heiress's hotel in this pre-censorship code screwball comedy." },
              
            { id: 4, title: "The California Reich", year: 1975, director: "Critchlow and Parks", genre: "Documentary", country: "USA", 
              coverUrl: "https://i.imgur.com/uidIpYy.png", 
              videoUrl: "https://youtu.be/owtC7BY3P7s",
              synopsis: "American Nazi Party members in Los Angeles, San Francisco and Tracy, California spill their guts in a familiar seeming cinema verite flick." },

            { id: 5, title: "Motel", year: 1989, director: "Christian Blackwood", genre: "Documentary", country: "USA", 
              coverUrl: "https://i.imgur.com/eK5jF0f.png", 
              videoUrl: "https://www.youtube.com/watch?v=XT0VUPi4vus",
              synopsis: "A look at Southwestern roadside motels from the POV of both owners and guests." },
            
            { id: 6, title: "The Black Stuff", year: 1982, director: "Jim Goddard", genre: "Dark Comedy", country: "UK", 
              coverUrl: "https://i.imgur.com/Ox3Zc8W.png",
              videoUrl: "https://www.youtube.com/watch?v=xd6yCvWxQ-M",
              synopsis: "The pilot to the beloved 1980's UK series, Boys From The Blackstuff, this follows a group of men desperately looking for work in Thatcher's Britain" },
        ];

        const contentArea = document.getElementById('content-area');

        // --- Navigation Functions ---

        function showHome() {
            APP_STATE.view = 'home';
            APP_STATE.selectedFilmId = null;
            APP_STATE.isPlaying = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showDetail(filmId) {
            APP_STATE.view = 'detail';
            APP_STATE.selectedFilmId = filmId;
            APP_STATE.isPlaying = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function playVideo() {
            APP_STATE.isPlaying = true;
            render();
        }

        // --- Rendering Components ---

        /**
         * Renders a single film card for the home grid.
         */
        function renderFilmCard(film) {
            // Apply the geometric diagonal-overlay class
            return `
                <div onclick="showDetail(${film.id})" 
                     class="relative w-full aspect-[4/5.6] overflow-hidden rounded-lg shadow-xl cursor-pointer group transition duration-300 transform hover:scale-[1.02] hover:shadow-sepia-primary/50 border border-sepia-primary/0 hover:border-sepia-primary">

                    <!-- Image Background -->
                    <img src="${film.coverUrl}" alt="${film.title} Poster" class="w-full h-full object-cover transition-opacity duration-500 group-hover:opacity-80">

                    <!-- Diagonal Overlay (70% opacity black covering the bottom half) -->
                    <div class="absolute inset-0 bg-sepia-dark/70 diagonal-overlay">
                        <div class="absolute bottom-0 p-4 w-full">
                            <!-- Film Title and Year -->
                            <h2 class="text-2xl font-bold text-sepia-primary tracking-wide uppercase">
                                ${film.title} (${film.year})
                            </h2>
                            <!-- Metadata -->
                            <p class="text-sm mt-1 text-sepia-light/90">Dir. by ${film.director}</p>
                            <p class="text-xs text-sepia-light/70">${film.genre} | ${film.country}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        /**
         * Renders the Video Player Area in the Detail View, supporting standard video and YouTube embeds.
         */
        function renderVideoArea(film) {
            const youtubeEmbedUrl = getYouTubeEmbedUrl(film.videoUrl);
            
            if (APP_STATE.isPlaying) {
                // If playing, render the appropriate player
                if (youtubeEmbedUrl) {
                    return `
                        <iframe 
                            class="w-full aspect-video rounded-lg shadow-2xl border-2 border-sepia-primary/50"
                            src="${youtubeEmbedUrl}"
                            frameborder="0"
                            allow="autoplay; encrypted-media"
                            allowfullscreen>
                        </iframe>
                    `;
                } else {
                    // Standard Video Player is Active
                    return `
                        <video controls autoplay class="w-full aspect-video rounded-lg shadow-2xl border-2 border-sepia-primary/50">
                            <source src="${film.videoUrl}" type="video/ogg">
                            Your browser does not support the video tag.
                        </video>
                    `;
                }
            } else {
                // Placeholder with Play Button
                return `
                    <div class="relative w-full aspect-video bg-cover bg-center rounded-lg shadow-2xl border-2 border-sepia-primary/50" 
                         style="background-image: url('${film.coverUrl}');">
                        
                        <!-- Dim Overlay -->
                        <div class="absolute inset-0 bg-sepia-dark/40 flex items-center justify-center rounded-lg">
                            
                            <!-- Play Button -->
                            <button onclick="playVideo()" 
                                    class="p-6 bg-sepia-primary/80 text-sepia-dark rounded-full shadow-lg hover:bg-sepia-primary transition duration-300 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-sepia-primary/50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 fill-current" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }
        }


        /**
         * Renders the detail page for a single film (Wireframe 2).
         */
        function renderDetailView() {
            const film = MOCK_FILMS.find(f => f.id === APP_STATE.selectedFilmId);
            if (!film) return showHome(); // Failsafe

            contentArea.innerHTML = `
                <div class="relative bg-sepia-dark p-6 md:p-10 shadow-inner rounded-xl border border-sepia-primary/30">
                    
                    <!-- Back Button (Unobtrusive 'X' or back arrow) -->
                    <button onclick="showHome()"
                            class="absolute top-4 left-4 md:top-6 md:left-6 text-sepia-light hover:text-sepia-primary transition duration-200 p-2 focus:outline-none z-10"
                            aria-label="Back to home">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </button>

                    <!-- Content Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 pt-10 lg:pt-0">
                        
                        <!-- Left Column: Video Player / Placeholder -->
                        <div class="lg:col-span-2">
                            <h2 class="text-3xl md:text-5xl font-extrabold text-sepia-light tracking-wide mb-6 uppercase">
                                ${film.title}
                            </h2>
                            ${renderVideoArea(film)}
                        </div>

                        <!-- Right Column: Metadata and Synopsis -->
                        <div class="lg:col-span-1 space-y-6">
                            
                            <!-- Metadata (Stylized Heading) -->
                            <div class="border-b border-sepia-primary/50 pb-4">
                                <p class="text-lg text-sepia-primary uppercase tracking-widest">${film.director}</p>
                                <p class="text-sm text-sepia-light/70">${film.genre} | ${film.country} | ${film.year}</p>
                            </div>
                            
                            <!-- Synopsis Area (Clean Text Block) -->
                            <div>
                                <h3 class="text-xl font-semibold text-sepia-light mb-2">Synopsis</h3>
                                <p class="text-sepia-light/80 leading-relaxed">${film.synopsis}</p>
                            </div>

                            <!-- Review Section (REMOVED: Letterboxd Link) -->
                            
                        </div>
                    </div>
                </div>
            `;
        }
        
        // --- Main Rendering and Initialization ---

        function render() {
            contentArea.innerHTML = ''; // Clear existing content

            if (APP_STATE.view === 'home') {
                // Home View: Grid of 6 Films
                contentArea.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-6 md:gap-8">
                        ${MOCK_FILMS.map(renderFilmCard).join('')}
                    </div>
                `;
            } else if (APP_STATE.view === 'detail') {
                renderDetailView();
            }
        }
        
        // Expose functions globally for HTML event handlers
        window.showHome = showHome;
        window.showDetail = showDetail;
        window.playVideo = playVideo;
        
        // Initialize the app view
        render();
    </script>
</body>
</html>
